server {
    listen 80;
    server_name mbg.example.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mbg.example.com;

    # SSL — ganti dengan sertifikat Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/mbg.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mbg.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Ukuran maksimal body
    client_max_body_size 10M;

    # Catatan penting soal add_header di Nginx.
    # Begitu sebuah blok location memakai add_header, seluruh add_header dari
    # level server berhenti diwariskan ke blok itu. Versi sebelumnya menaruh
    # header keamanan di level server sementara ketiga location punya
    # add_header Cache-Control sendiri, sehingga header keamanan tidak pernah
    # terkirim. Solusinya: kumpulkan di satu berkas lalu include di tiap blok.
    #
    # Isi /etc/nginx/snippets/mbg-security.conf:
    #   add_header X-Frame-Options "DENY" always;
    #   add_header X-Content-Type-Options "nosniff" always;
    #   add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    #   add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Static files — dilayani langsung Nginx
    location /static/ {
        include snippets/mbg-security.conf;
        alias /opt/mbg/app/static/;
        expires 1h;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Health check (no cache, no rate limit)
    location /health {
        include snippets/mbg-security.conf;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store";
        access_log off;
    }

    # Proxy ke Gunicorn
    location / {
        include snippets/mbg-security.conf;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store";
    }

}
